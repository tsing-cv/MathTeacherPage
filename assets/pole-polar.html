<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>极点与极线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#060e1e;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
console.log('[pole-polar] v7 loaded - P label below dot');
/* ================================================================
   极点与极线 · 三种情况（自适应画布 v2）
   椭圆 E: x²/9 + y² = 1  (a=3, b=1)
================================================================ */
const cv=document.getElementById('cv'),c=cv.getContext('2d');
let W,H;
function resize(){
  W=cv.width=cv.offsetWidth*(window.devicePixelRatio||1);
  H=cv.height=cv.offsetHeight*(window.devicePixelRatio||1);
}
resize();
addEventListener('resize',resize);

const dpr=()=>window.devicePixelRatio||1;

const cases=[
  {label:'① P 在椭圆外',sub:'完整四边形构造·极线在椭圆内',px:3.5,py:1.2,color:'#FFD700',showSec:true,showTan:true},
  {label:'② P 趋近椭圆',sub:'极线 → 切线（极限情况）',px:3.05*Math.cos(0.7),py:1.0167*Math.sin(0.7),color:'#FFD700',showSec:true,showTan:true},
  {label:'③ P 在椭圆内',sub:'完整四边形构造·极线在椭圆外',px:2.0,py:0.5,color:'#FFD700',showSec:true,showTan:true}
];

let ci=0,t0=null;
const CASE_DUR=5500,TRANS_DUR=600;

function inside(px,py){const v=px*px/9+py*py;return v<1-1e-6?-1:v>1+1e-6?1:0}

/* ── 自适应坐标系：椭圆尽量占满画布 ── */
function layout(){
  const d=dpr();
  const padX=W*0.07;           // 左右各留 7%
  const availW=W-padX*2;       // 可用宽度
  const availH=H*0.88;         // 上下各留 6% 给标题+信息框
  const scaleX=availW/8;       // x 范围 [-4,4]=8
  const scaleY=availH/3;       // y 范围 [-1.5,1.5]=3
  const S=Math.min(scaleX,scaleY)*0.95;
  return{
    ox:W/2, oy:H*0.50, S,
    tx:x=>W/2+x*S,
    ty:y=>H*0.50-y*S
  };
}

/* ── 几何 ── */
function tangentPts(px,py){
  // 参数化求切点：椭圆上 (3cos t, sin t)，切线过 P(px,py)
  // → px·cos(t)/3 + py·sin(t) = 1
  // 万能置换 u=tan(t/2):  (px/3+py)u² - 2u + (px/3-py) = 0
  const r=px/3, A=r+py, B=-2, C=r-py;
  const disc=B*B-4*A*C;
  if(disc<0)return[];
  const sq=Math.sqrt(disc);
  const u1=(-B+sq)/(2*A), u2=(-B-sq)/(2*A);
  const t1=2*Math.atan(u1), t2=2*Math.atan(u2);
  return[{x:3*Math.cos(t1),y:Math.sin(t1)},{x:3*Math.cos(t2),y:Math.sin(t2)}];
}
function secantHits(px,py,theta){
  const co=Math.cos(theta),si=Math.sin(theta);
  const aa=co*co/9+si*si, bb=2*(px*co/9+py*si), cc=px*px/9+py*py-1;
  const d=bb*bb-4*aa*cc;
  if(d<0)return null;
  const sq=Math.sqrt(d);
  return[{x:px+(-bb-sq)/(2*aa)*co,y:py+(-bb-sq)/(2*aa)*si},
         {x:px+(-bb+sq)/(2*aa)*co,y:py+(-bb+sq)/(2*aa)*si}];
}

/* ── 绘制工具 ─ */
function drawEllipse(L,alpha){
  const d=dpr();
  // 半透明填充
  c.save();c.globalAlpha=alpha*0.06;c.fillStyle='#00BFFF';
  c.beginPath();
  for(let i=0;i<=200;i++){
    const t=(i/200)*Math.PI*2,x=3*Math.cos(t),y=Math.sin(t);
    i===0?c.moveTo(L.tx(x),L.ty(y)):c.lineTo(L.tx(x),L.ty(y));
  }
  c.closePath();c.fill();c.restore();
  // 发光描边
  c.save();c.globalAlpha=alpha;c.strokeStyle='#00BFFF';c.lineWidth=2.5*dpr();
  c.shadowBlur=16*dpr();c.shadowColor='#00BFFF';c.beginPath();
  for(let i=0;i<=200;i++){
    const t=(i/200)*Math.PI*2,x=3*Math.cos(t),y=Math.sin(t);
    i===0?c.moveTo(L.tx(x),L.ty(y)):c.lineTo(L.tx(x),L.ty(y));
  }
  c.stroke();c.restore();
}

function drawDot(L,x,y,col,r,lbl,ox,oy){
  const d=dpr();
  c.save();c.shadowBlur=20*dpr();c.shadowColor=col;c.fillStyle=col;
  c.beginPath();c.arc(L.tx(x),L.ty(y),r*dpr(),0,Math.PI*2);c.fill();
  // 白色高光
  c.shadowBlur=0;c.fillStyle='rgba(255,255,255,0.8)';
  c.beginPath();c.arc(L.tx(x)-1.5*dpr(),L.ty(y)-1.5*dpr(),r*0.35*dpr(),0,Math.PI*2);c.fill();
  if(lbl){
    c.fillStyle=col;c.font=`bold ${15*dpr()}px sans-serif`;c.shadowBlur=8*dpr();c.shadowColor=col;
    c.fillText(lbl,L.tx(x)+(ox||14*dpr()),L.ty(y)+(oy||-12*dpr()));
  }
  c.restore();
}

function drawLine(L,x1,y1,x2,y2,col,w,alpha,dash){
  const d=dpr();
  c.save();c.globalAlpha=alpha??1;
  if(dash)c.setLineDash(dash.map(v=>v*dpr()));
  c.shadowBlur=10*dpr();c.shadowColor=col;c.strokeStyle=col;c.lineWidth=w*dpr();c.lineCap='round';
  c.beginPath();c.moveTo(L.tx(x1),L.ty(y1));c.lineTo(L.tx(x2),L.ty(y2));c.stroke();
  // 白色芯线
  c.shadowBlur=0;c.globalAlpha=(alpha??1)*0.35;c.strokeStyle='#fff';c.lineWidth=Math.max(0.5,w*0.2)*dpr();
  c.beginPath();c.moveTo(L.tx(x1),L.ty(y1));c.lineTo(L.tx(x2),L.ty(y2));c.stroke();
  c.restore();
}

function drawPolarLine(L,px,py,alpha){
  const YMAX=4,YMIN=-4;
  if(Math.abs(py)<0.01){
    const xv=9/px;
    if(xv>=-5&&xv<=5)drawLine(L,xv,YMIN,xv,YMAX,'#00FF88',2.5,alpha);
    return;
  }
  const f=x=>(1-x*px/9)/py;
  const xL=-5,xR=5;
  let x1=xL,y1=f(xL),x2=xR,y2=f(xR);
  const m=(y2-y1)/(x2-x1),yc=(y1+y2)/2-m*(x1+x2)/2;
  if(m>0){y1=YMIN;y2=YMAX}else if(m<0){y1=YMAX;y2=YMIN}
  if(Math.abs(m)>1e-9){x1=(y1-yc)/m;x2=(y2-yc)/m}
  drawLine(L,x1,y1,x2,y2,'#00FF88',2.5,alpha);
}

/* ── 扩展线段到画布边界（Cohen-Sutherland 裁剪）── */
function clipToCanvas(L,x1,y1,x2,y2){
  const xMin=-W/(2*L.S)-2, xMax=W/(2*L.S)+2;
  const yMin=-H/(2*L.S)-2, yMax=H/(2*L.S)+2;
  const dx=x2-x1, dy=y2-y1;
  let tMin=0, tMax=1;
  if(Math.abs(dx)<1e-12){
    if(x1<xMin||x1>xMax)return null;
  }else{
    let a=(xMin-x1)/dx, b=(xMax-x1)/dx;
    if(a>b){const tmp=a;a=b;b=tmp;}
    tMin=Math.max(tMin,a); tMax=Math.min(tMax,b);
    if(tMin>tMax)return null;
  }
  if(Math.abs(dy)<1e-12){
    if(y1<yMin||y1>yMax)return null;
  }else{
    let a=(yMin-y1)/dy, b=(yMax-y1)/dy;
    if(a>b){const tmp=a;a=b;b=tmp;}
    tMin=Math.max(tMin,a); tMax=Math.min(tMax,b);
    if(tMin>tMax)return null;
  }
  return{x1:x1+tMin*dx,y1:y1+tMin*dy,x2:x1+tMax*dx,y2:y1+tMax*dy};
}
function drawExtLine(L,x1,y1,x2,y2,col,w,alpha,dash){
  const cl=clipToCanvas(L,x1,y1,x2,y2);
  if(cl)drawLine(L,cl.x1,cl.y1,cl.x2,cl.y2,col,w,alpha,dash);
}
/* ── 从 p1 经 p2 延伸 k 倍后裁剪到画布 ─ */
function drawLineThrough(L,p1x,p1y,p2x,p2y,k,col,w,alpha,dash){
  const ex=p2x+(p2x-p1x)*k, ey=p2y+(p2y-p1y)*k;
  drawExtLine(L,p1x,p1y,ex,ey,col,w,alpha,dash);
}

function drawTangentPts(L,px,py,alpha){
  const d=dpr();
  const pts=tangentPts(px,py);if(pts.length<2)return;
  pts.forEach((p,i)=>{
    c.save();c.globalAlpha=alpha;c.shadowBlur=14*dpr();c.shadowColor='#00FF88';
    c.fillStyle='#00FF88';c.beginPath();c.arc(L.tx(p.x),L.ty(p.y),5.5*dpr(),0,Math.PI*2);c.fill();
    c.shadowBlur=0;c.fillStyle='#fff';c.beginPath();c.arc(L.tx(p.x),L.ty(p.y),2*dpr(),0,Math.PI*2);c.fill();
    c.fillStyle='#00FF88';c.font=`bold ${12*dpr()}px sans-serif`;
    c.fillText('T'+(i+1),L.tx(p.x)+9*dpr(),L.ty(p.y)+(i===0?-10*dpr():16*dpr()));
    c.restore();
  });
  drawLine(L,pts[0].x,pts[0].y,pts[1].x,pts[1].y,'#00FF88',1.5,alpha*0.4,[5,4]);
}

function drawSecants(L,px,py,alpha){
  const d=dpr();
  const v=px*px/9+py*py;
  // 退化：P 极近椭圆 → 割线退化为切线
  if(v>1 && v-1<0.01){
    const tdx=-py, tdy=px/9;
    const tLen=5;
    drawLine(L,px-tdx*tLen,py-tdy*tLen,px+tdx*tLen,py+tdy*tLen,'#FFA500',2.0,alpha,[8,4]);
    c.save();c.globalAlpha=alpha;c.fillStyle='#FFA500';c.font=`bold ${12*dpr()}px sans-serif`;c.shadowBlur=6*dpr();c.shadowColor='#FFA500';
    c.fillText('← 割线退化为切线',L.tx(px)+14*dpr(),L.ty(py)-18*dpr());c.restore();
    return;
  }
  let h1,h2;
  if(v<1){
    // P 在椭圆内：用指向中心的方向 + 垂直方向作为两条割线
    const base=Math.atan2(-py,-px);
    h1=secantHits(px,py,base+0.5);
    h2=secantHits(px,py,base-0.7);
  } else {
    // P 在椭圆外（远离边界）：用切线方向确定割线夹角
    const tPts=tangentPts(px,py);
    if(!tPts||tPts.length<2)return;
    const v1={x:tPts[0].x-px,y:tPts[0].y-py},v2={x:tPts[1].x-px,y:tPts[1].y-py};
    const l1=Math.hypot(v1.x,v1.y),l2=Math.hypot(v2.x,v2.y);
    const bis={x:v1.x/l1+v2.x/l2,y:v1.y/l1+v2.y/l2};
    const bisAng=Math.atan2(bis.y,bis.x);
    const tanAng1=Math.atan2(v1.y,v1.x),tanAng2=Math.atan2(v2.y,v2.x);
    let spread=Math.abs(tanAng1-tanAng2);
    if(spread>Math.PI)spread=2*Math.PI-spread;
    const halfSpread=spread*0.35;
    h1=secantHits(px,py,bisAng-halfSpread);
    h2=secantHits(px,py,bisAng+halfSpread);
  }
  if(!h1||!h2)return;
  const pairs=[[h1,'A','B'],[h2,'C','D']];
  pairs.forEach(([pts,lbl1,lbl2])=>{
    // 主线：P→交点（白色实线，较粗）
    drawLine(L,px,py,pts[0].x,pts[0].y,'#ffffff',1.8,alpha);
    drawLine(L,px,py,pts[1].x,pts[1].y,'#ffffff',1.8,alpha);
    pts.forEach((p,j)=>{
      const lb=j===0?lbl1:lbl2;
      c.save();c.globalAlpha=alpha;c.fillStyle='#fff';c.shadowBlur=6*dpr();c.shadowColor='#fff';
      c.beginPath();c.arc(L.tx(p.x),L.ty(p.y),3.5*dpr(),0,Math.PI*2);c.fill();
      c.shadowBlur=0;c.font=`bold ${12*dpr()}px sans-serif`;
      c.fillText(lb,L.tx(p.x)+8*dpr(),L.ty(p.y)-8*dpr());c.restore();
    });
  });
  const A=h1[0],B=h1[1],C=h2[0],D=h2[1];
  function xsect(a,b,d,e){
    const dn=(a.x-b.x)*(d.y-e.y)-(a.y-b.y)*(d.x-e.x);
    if(Math.abs(dn)<1e-10)return null;
    const t=((a.x-d.x)*(d.y-e.y)-(a.y-d.y)*(d.x-e.x))/dn;
    return{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)};
  }
  const Q1=xsect(A,D,B,C),Q2=xsect(A,C,B,D);
  if(Q1){drawLineThrough(L,A.x,A.y,Q1.x,Q1.y,3,'#00E5FF',1.2,alpha*0.55,[6,3]);
         drawLineThrough(L,B.x,B.y,Q1.x,Q1.y,3,'#00E5FF',1.2,alpha*0.55,[6,3]);
         drawLineThrough(L,D.x,D.y,Q1.x,Q1.y,3,'#00E5FF',1.2,alpha*0.55,[6,3]);
         drawLineThrough(L,C.x,C.y,Q1.x,Q1.y,3,'#00E5FF',1.2,alpha*0.55,[6,3]);
         c.save();c.globalAlpha=alpha;c.fillStyle='#00E5FF';c.shadowBlur=12*dpr();c.shadowColor='#00E5FF';
         c.beginPath();c.arc(L.tx(Q1.x),L.ty(Q1.y),5*dpr(),0,Math.PI*2);c.fill();
         c.shadowBlur=0;c.font=`bold ${12*dpr()}px sans-serif`;c.fillText('Q₁=AD∩BC',L.tx(Q1.x)+9*dpr(),L.ty(Q1.y)+5*dpr());c.restore();}
  if(Q2){drawLineThrough(L,A.x,A.y,Q2.x,Q2.y,3,'#FF69B4',1.2,alpha*0.55,[6,3]);
         drawLineThrough(L,C.x,C.y,Q2.x,Q2.y,3,'#FF69B4',1.2,alpha*0.55,[6,3]);
         drawLineThrough(L,B.x,B.y,Q2.x,Q2.y,3,'#FF69B4',1.2,alpha*0.55,[6,3]);
         drawLineThrough(L,D.x,D.y,Q2.x,Q2.y,3,'#FF69B4',1.2,alpha*0.55,[6,3]);
         c.save();c.globalAlpha=alpha;c.fillStyle='#FF69B4';c.shadowBlur=12*dpr();c.shadowColor='#FF69B4';
         c.beginPath();c.arc(L.tx(Q2.x),L.ty(Q2.y),5*dpr(),0,Math.PI*2);c.fill();
         c.shadowBlur=0;c.font=`bold ${12*dpr()}px sans-serif`;c.fillText('Q₂=AC∩BD',L.tx(Q2.x)+9*dpr(),L.ty(Q2.y)+5*dpr());c.restore();}
}

/* ── 信息框：左下角，只显示标题 ── */
function drawInfo(L,cas,progress){
  const d=dpr();
  const bw=180*dpr(),bh=30*dpr();
  const bx=12*dpr(), by=H-bh-12*dpr();
  c.save();c.globalAlpha=progress;
  c.fillStyle='rgba(6,14,30,0.85)';c.strokeStyle='#4cc9ff30';c.lineWidth=1*dpr();
  c.beginPath();c.roundRect(bx,by,bw,bh,6*dpr());c.fill();c.stroke();
  c.fillStyle=cas.color;
  c.beginPath();c.roundRect(bx,by,3*dpr(),bh,[6*dpr(),0,0,6*dpr()]);c.fill();
  c.fillStyle=cas.color;c.font=`bold ${14*dpr()}px sans-serif`;c.fillText(cas.label,bx+12*dpr(),by+21*dpr());
  c.restore();
}

function drawTitle(L){
  const d=dpr();
  const x=16*dpr(), y=20*dpr(), fs=15*dpr();
  c.save();c.fillStyle='#c8e0f0';c.font=`600 ${fs}px sans-serif`;c.textAlign='left';
  c.shadowBlur=10*dpr();c.shadowColor='#4cc9ff50';
  // "椭圆 E : "
  const t1='椭圆  E :  ';
  c.fillText(t1,x,y);
  let cx=x+c.measureText(t1).width;
  // 分数 x²/9（上下格式）
  const num='x²', den='9', gap=2*dpr(), barW=fs*0.9;
  c.font=`italic 600 ${fs*0.85}px sans-serif`;
  const nw=c.measureText(num).width, dw2=c.measureText(den).width;
  const fracX=cx+Math.max(nw,dw2)/2;
  // 分子
  c.textAlign='center';c.fillText(num,fracX,y-fs*0.35);
  // 分数线
  c.strokeStyle='#c8e0f0';c.lineWidth=1*dpr();c.shadowBlur=0;
  c.beginPath();c.moveTo(fracX-barW/2,y);c.lineTo(fracX+barW/2,y);c.stroke();
  c.shadowBlur=10*dpr();c.shadowColor='#4cc9ff50';
  // 分母
  c.fillText(den,fracX,y+fs*0.7);
  // " + y² = 1"
  cx=fracX+Math.max(nw,dw2)/2+4*dpr();
  c.textAlign='left';c.font=`600 ${fs}px sans-serif`;
  c.fillText(' +  y² = 1',cx,y);
  c.restore();
}

function drawDots(ci,total){
  const d=dpr(),dw=9*dpr(),gap=5*dpr(),tw=total*(dw+gap)-gap,sx=(W-tw)/2,sy=H-10*dpr();
  c.save();
  for(let i=0;i<total;i++){
    const active=i===ci;
    c.fillStyle=active?'#00BFFF':'#1a3a5a';
    c.shadowBlur=active?8*dpr():0;c.shadowColor='#00BFFF';
    c.beginPath();c.arc(sx+i*(dw+gap)+dw/2,sy,dw/2,0,Math.PI*2);c.fill();
  }
  c.restore();
}

/* ── P 点脉冲光环 ── */
function drawPulse(L,px,py,t){
  const d=dpr();
  const pulseR=(7+3*Math.sin(t*3))*dpr();
  c.save();c.globalAlpha=0.15+0.1*Math.sin(t*3);
  c.strokeStyle='#FFD700';c.lineWidth=1.5*dpr();
  c.beginPath();c.arc(L.tx(px),L.ty(py),pulseR,0,Math.PI*2);c.stroke();
  c.restore();
}

/* ── 主循环 ── */
function frame(now){
  if(!t0)t0=now;
  const elapsed=now-t0, cycleLen=CASE_DUR+TRANS_DUR;
  const newCi=Math.floor(elapsed/cycleLen)%cases.length;
  if(newCi!==ci)ci=newCi;
  const cp=elapsed%cycleLen;
  let prog=1;
  if(cp>CASE_DUR)prog=Math.max(0,1-(cp-CASE_DUR)/TRANS_DUR);
  else if(cp<300)prog=cp/300;

  const L=layout();
  // 背景渐变
  const g=c.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,W*0.75);
  g.addColorStop(0,'#0c1e3a');g.addColorStop(0.6,'#081628');g.addColorStop(1,'#060e1e');
  c.fillStyle=g;c.fillRect(0,0,W,H);

  // 坐标轴
  c.save();c.strokeStyle='#1a3a5a';c.lineWidth=1*dpr();c.setLineDash([4*dpr(),4*dpr()]);
  c.beginPath();c.moveTo(0,L.ty(0));c.lineTo(W,L.ty(0));c.stroke();
  c.beginPath();c.moveTo(L.tx(0),0);c.lineTo(L.tx(0),H);c.stroke();c.restore();
  c.save();c.fillStyle='#3a6a8a';c.font=`${11*dpr()}px sans-serif`;c.textAlign='center';
  [-3,-2,-1,1,2,3].forEach(v=>c.fillText(v,L.tx(v),L.ty(0)+15*dpr()));
  c.fillText('O',L.tx(0)-12*dpr(),L.ty(0)+15*dpr());c.restore();

  drawTitle(L);
  drawDots(ci,cases.length);

  const cas=cases[ci];
  const ea=0.3+0.7*Math.min(1,prog*2.5);
  drawEllipse(L,ea);
  drawPolarLine(L,cas.px,cas.py,prog);
  if(cas.showTan&&prog>0.4)drawTangentPts(L,cas.px,cas.py,(prog-0.4)/0.6);
  if(cas.showSec&&prog>0.3)drawSecants(L,cas.px,cas.py,(prog-0.3)/0.7);
  drawPulse(L,cas.px,cas.py,elapsed/1000);
  drawDot(L,cas.px,cas.py,cas.color,8,'P',-6*dpr(),22*dpr());
  drawInfo(L,cas,prog);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
